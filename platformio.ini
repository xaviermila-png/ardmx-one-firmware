; Firmware ARDMX One — ESP32 DevKit V1 + MAX485 (direcció automàtica) + Bluetooth Classic SPP
; Una única escena DMX estàtica (fins a 512 canals), sense àudio ni cicles.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    someweisguy/esp_dmx@^4.1.0
