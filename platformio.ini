; Firmware ARDMX One — ESP32 DevKit V1 + MAX485 (direcció automàtica) + BLE (GATT)
; Una única escena DMX estàtica (fins a 512 canals), sense àudio ni cicles.
;
; Migrat de Bluetooth Classic (SPP) a BLE (2026-08) per poder donar suport a
; iOS en el futur (Classic no és accessible des d'apps de tercers a iOS sense
; certificació MFi; BLE sí, via CoreBluetooth). NimBLE-Arduino en lloc de la
; llibreria BLE del core (basada en Bluedroid): molt més lleugera en flash/
; RAM i més fiable en notificacions llargues/reconnexions — rellevant perquè
; el firmware germà ARDMX4 EVO ja va arribar al 87% de flash ocupat, en bona
; part per la pila Bluedroid de BluetoothSerial.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    someweisguy/esp_dmx@^4.1.0
    h2zero/NimBLE-Arduino@^1.4.1
